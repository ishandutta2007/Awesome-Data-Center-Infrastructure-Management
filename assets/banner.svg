<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-bg { fill: url(#grid); }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: url(#primaryGrad); }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .tagline-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 14px; fill: #64748b; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; }

    /* Animated elements in background */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(-15px, 15px); opacity: 0.65; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes serverBlink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @keyframes dataFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes scanline {
      0% { transform: translateY(-50px); opacity: 0; }
      30% { opacity: 0.4; }
      70% { opacity: 0.4; }
      100% { transform: translateY(440px); opacity: 0; }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate; transform-origin: 1000px 300px; }
    .flow-line { stroke-dasharray: 8 12; animation: dataFlow 4s linear infinite; }
    .flow-line-rev { stroke-dasharray: 6 10; animation: dataFlow 5s linear infinite reverse; }
    .led-green { animation: serverBlink 2.2s ease-in-out infinite; }
    .led-cyan { animation: serverBlink 1.7s ease-in-out infinite 0.5s; }
    .led-purple { animation: serverBlink 2.8s ease-in-out infinite 1s; }
    .scanner { animation: scanline 7s ease-in-out infinite; }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 3s; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" class="grid-bg" />

  <!-- Dynamic Background Ambient Glowing Orbs -->
  <g>
    <circle class="orb-1" cx="220" cy="120" r="160" fill="url(#accentCyan)" filter="url(#pulseGlow)" />
    <circle class="orb-2" cx="980" cy="280" r="180" fill="url(#accentPurple)" filter="url(#pulseGlow)" />
  </g>

  <!-- Subtle Dynamic Scanline -->
  <line class="scanner" x1="0" y1="0" x2="1200" y2="0" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" filter="url(#glow)" />

  <!-- Background Data Center Architectural Silhouettes & Flow Lines -->
  <g opacity="0.45">
    <!-- Server Rack 1 Left Silhouette -->
    <rect x="70" y="80" width="70" height="260" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
    <line x1="75" y1="110" x2="135" y2="110" stroke="#1f2937" stroke-width="1" />
    <line x1="75" y1="140" x2="135" y2="140" stroke="#1f2937" stroke-width="1" />
    <line x1="75" y1="170" x2="135" y2="170" stroke="#1f2937" stroke-width="1" />
    <line x1="75" y1="200" x2="135" y2="200" stroke="#1f2937" stroke-width="1" />
    <line x1="75" y1="230" x2="135" y2="230" stroke="#1f2937" stroke-width="1" />
    <line x1="75" y1="260" x2="135" y2="260" stroke="#1f2937" stroke-width="1" />
    <line x1="75" y1="290" x2="135" y2="290" stroke="#1f2937" stroke-width="1" />
    <circle class="led-green" cx="85" cy="95" r="3" fill="#10b981" />
    <circle class="led-cyan" cx="85" cy="125" r="3" fill="#06b6d4" />
    <circle class="led-green" cx="85" cy="155" r="3" fill="#10b981" />
    <circle class="led-cyan" cx="85" cy="185" r="3" fill="#38bdf8" />
    <circle class="led-green" cx="85" cy="215" r="3" fill="#10b981" />
    <circle class="led-purple" cx="85" cy="245" r="3" fill="#a855f7" />
    <circle class="led-green" cx="85" cy="275" r="3" fill="#10b981" />
    <circle class="led-cyan" cx="85" cy="305" r="3" fill="#06b6d4" />

    <!-- Server Rack 2 Right Silhouette -->
    <rect x="1060" y="80" width="70" height="260" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
    <line x1="1065" y1="110" x2="1125" y2="110" stroke="#1f2937" stroke-width="1" />
    <line x1="1065" y1="140" x2="1125" y2="140" stroke="#1f2937" stroke-width="1" />
    <line x1="1065" y1="170" x2="1125" y2="170" stroke="#1f2937" stroke-width="1" />
    <line x1="1065" y1="200" x2="1125" y2="200" stroke="#1f2937" stroke-width="1" />
    <line x1="1065" y1="230" x2="1125" y2="230" stroke="#1f2937" stroke-width="1" />
    <line x1="1065" y1="260" x2="1125" y2="260" stroke="#1f2937" stroke-width="1" />
    <line x1="1065" y1="290" x2="1125" y2="290" stroke="#1f2937" stroke-width="1" />
    <circle class="led-cyan" cx="1075" cy="95" r="3" fill="#38bdf8" />
    <circle class="led-green" cx="1075" cy="125" r="3" fill="#10b981" />
    <circle class="led-purple" cx="1075" cy="155" r="3" fill="#a855f7" />
    <circle class="led-green" cx="1075" cy="185" r="3" fill="#10b981" />
    <circle class="led-cyan" cx="1075" cy="215" r="3" fill="#06b6d4" />
    <circle class="led-green" cx="1075" cy="245" r="3" fill="#10b981" />
    <circle class="led-purple" cx="1075" cy="275" r="3" fill="#c084fc" />
    <circle class="led-green" cx="1075" cy="305" r="3" fill="#10b981" />

    <!-- Connecting Topology Circuit Lines -->
    <path class="flow-line" d="M 140 125 C 300 125, 300 60, 480 60" fill="none" stroke="#38bdf8" stroke-width="1.8" />
    <path class="flow-line-rev" d="M 140 275 C 300 275, 300 360, 520 360" fill="none" stroke="#818cf8" stroke-width="1.8" />
    <path class="flow-line" d="M 1060 125 C 900 125, 900 60, 720 60" fill="none" stroke="#a855f7" stroke-width="1.8" />
    <path class="flow-line-rev" d="M 1060 275 C 900 275, 900 360, 680 360" fill="none" stroke="#38bdf8" stroke-width="1.8" />
  </g>

  <!-- Ambient Dynamic Floating Data Nodes -->
  <g>
    <circle class="particle-1" cx="280" cy="80" r="4" fill="#38bdf8" filter="url(#glow)" />
    <circle class="particle-2" cx="920" cy="90" r="5" fill="#a855f7" filter="url(#glow)" />
    <circle class="particle-3" cx="340" cy="340" r="4.5" fill="#10b981" filter="url(#glow)" />
    <circle class="particle-1" cx="860" cy="340" r="4" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Center Decorative Shield Icon (DCIM Hardware & Network Hub) -->
  <g transform="translate(600, 75)">
    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
    <!-- Server Stack Minimal Icon -->
    <rect x="-14" y="-14" width="28" height="7" rx="1.5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="-9" cy="-10.5" r="1.5" fill="#10b981" />
    <rect x="-14" y="-4" width="28" height="7" rx="1.5" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="-9" cy="-0.5" r="1.5" fill="#38bdf8" />
    <rect x="-14" y="6" width="28" height="7" rx="1.5" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
    <circle cx="-9" cy="9.5" r="1.5" fill="#a855f7" />
  </g>

  <!-- FOREGROUND: Titles and Clear Static Text (Never Occluded) -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="165" class="title-text">
      Awesome DCIM
    </text>

    <!-- Subtitle -->
    <text x="600" y="205" class="subtitle-text">
      Data Center Infrastructure Management Ecosystem
    </text>

    <!-- Tagline -->
    <text x="600" y="240" class="tagline-text">
      Curated Guide to Enterprise SaaS Platforms &amp; Open-Source Source-of-Truth Solutions
    </text>
  </g>

  <!-- Feature Focus Pills (Foreground) -->
  <g transform="translate(600, 290)">
    <!-- Pill 1: Asset Tracking -->
    <g transform="translate(-360, 0)">
      <rect x="0" y="0" width="165" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
      <text x="82.5" y="23" text-anchor="middle" class="pill-text">🏷️ Asset Tracking</text>
    </g>

    <!-- Pill 2: Rack Elevations -->
    <g transform="translate(-180, 0)">
      <rect x="0" y="0" width="165" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.8" />
      <text x="82.5" y="23" text-anchor="middle" class="pill-text">🖥️ Rack Elevations</text>
    </g>

    <!-- Pill 3: Power & Cooling -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="165" height="36" rx="18" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.8" />
      <text x="82.5" y="23" text-anchor="middle" class="pill-text">⚡ Power &amp; Thermal</text>
    </g>

    <!-- Pill 4: Capacity & Planning -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="175" height="36" rx="18" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.8" />
      <text x="87.5" y="23" text-anchor="middle" class="pill-text">📊 Capacity Planning</text>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="0" y="414" width="1200" height="6" fill="url(#primaryGrad)" />
</svg>
